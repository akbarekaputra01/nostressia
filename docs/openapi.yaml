openapi: 3.0.3
info:
  title: Nostressia API
  version: "1.0.0"
servers:
  - url: /api
paths:
  /stress/forecast:
    get:
      summary: Get global stress forecast
      tags:
        - Stress Insights
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Forecast fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseGlobalForecast"
              examples:
                success:
                  value:
                    success: true
                    message: Forecast fetched
                    data:
                      forecast:
                        userId: 1
                        forecastDate: "2024-01-01"
                        probability: 0.6
                        chancePercent: 60
                        threshold: 0.5
                        predictionBinary: 1
                        predictionLabel: High
                        modelType: global_markov
                      eligibility:
                        userId: 1
                        eligible: true
                        streak: 7
                        requiredStreak: 7
                        restoreUsed: 0
                        restoreRemaining: 3
                        restoreLimit: 3
                        missing: 0
                        note: Eligible
                    errors: null
                    meta: null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
        "403":
          description: Not eligible for forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
              examples:
                notEligible:
                  value:
                    success: false
                    message: Request failed
                    data: null
                    errors:
                      - code: FORECAST_NOT_ELIGIBLE
                        eligibility:
                          userId: 1
                          eligible: false
                          streak: 1
                          requiredStreak: 7
                          restoreUsed: 0
                          restoreRemaining: 3
                          restoreLimit: 3
                          missing: 6
                          note: Not enough logs
                    meta: null
  /stress-levels/eligibility:
    get:
      summary: Get stress log eligibility
      tags:
        - Stress Levels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Eligibility fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEligibility"
              examples:
                success:
                  value:
                    success: true
                    message: Eligibility fetched
                    data:
                      userId: 1
                      eligible: true
                      streak: 7
                      requiredStreak: 7
                      restoreUsed: 0
                      restoreRemaining: 3
                      restoreLimit: 3
                      missing: 0
                      note: Eligible
                    errors: null
                    meta: null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponseEligibility:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Eligibility"
        errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApiError"
        meta:
          type: object
          nullable: true
          additionalProperties: true
    ApiResponseGlobalForecast:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/GlobalForecastPayload"
        errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApiError"
        meta:
          type: object
          nullable: true
          additionalProperties: true
    ApiResponseError:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
        - errors
        - meta
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        data:
          nullable: true
        errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApiError"
        meta:
          type: object
          nullable: true
          additionalProperties: true
    ApiError:
      type: object
      additionalProperties: true
    Eligibility:
      type: object
      additionalProperties: false
      required:
        - userId
        - eligible
        - streak
        - requiredStreak
        - restoreUsed
        - restoreRemaining
        - restoreLimit
        - missing
        - note
      properties:
        userId:
          type: integer
        eligible:
          type: boolean
        streak:
          type: integer
        requiredStreak:
          type: integer
        restoreUsed:
          type: integer
        restoreRemaining:
          type: integer
        restoreLimit:
          type: integer
        missing:
          type: integer
        note:
          type: string
    GlobalForecastResult:
      type: object
      additionalProperties: false
      required:
        - userId
        - forecastDate
        - probability
        - chancePercent
        - threshold
        - predictionBinary
        - predictionLabel
        - modelType
      properties:
        userId:
          type: integer
        forecastDate:
          type: string
        probability:
          type: number
        chancePercent:
          type: number
        threshold:
          type: number
        predictionBinary:
          type: integer
        predictionLabel:
          type: string
        modelType:
          type: string
    GlobalForecastPayload:
      type: object
      additionalProperties: false
      required:
        - forecast
        - eligibility
      properties:
        forecast:
          $ref: "#/components/schemas/GlobalForecastResult"
        eligibility:
          $ref: "#/components/schemas/Eligibility"
