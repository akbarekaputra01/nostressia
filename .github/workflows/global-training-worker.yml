name: Global Forecast Training

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  train-global:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nostressia-backend/requirements.txt
          pip install -r nostressia-machine-learning/requirements.txt

      - name: Refresh dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python nostressia-machine-learning/Stress-Forecast/scripts/refresh_dataset.py

      - name: Train global model (60-day gate)
        run: |
          python nostressia-machine-learning/Stress-Forecast/scripts/train_global.py

      - name: Commit updated artifacts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .ml_state.json nostressia-machine-learning/Stress-Forecast/datasets/stress_forecast.csv \
              nostressia-backend/app/models_ml/global_forecast.joblib \
              nostressia-backend/app/models_ml/global_forecast.meta.json
            git commit -m "Update global forecast model"
            git push
          else
            echo "No changes to commit."
          fi
