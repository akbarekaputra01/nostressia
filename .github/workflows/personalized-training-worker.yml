name: Personalized Forecast Training

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_user_id:
        description: "Force personalized training for a specific user_id (ignores 60-day milestone gate)."
        required: false
        type: string
      force_window_size:
        description: "Override training window size when forcing personalized training."
        required: false
        type: string

jobs:
  train-personalized:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nostressia-backend/requirements.txt
          pip install -r nostressia-machine-learning/requirements.txt

      - name: Refresh dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python nostressia-machine-learning/Stress-Forecast/scripts/refresh_dataset.py

      - name: Train personalized models (milestone gate)
        run: |
          python nostressia-machine-learning/Stress-Forecast/scripts/train_personalized.py \
            ${{ inputs.force_user_id && format('--force-user-id {0}', inputs.force_user_id) || '' }} \
            ${{ inputs.force_window_size && format('--force-window-size {0}', inputs.force_window_size) || '' }}

      - name: Commit updated artifacts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .ml_state.json nostressia-machine-learning/Stress-Forecast/datasets/stress_forecast.csv \
              nostressia-backend/app/models_ml/personalized_forecast.joblib \
              nostressia-backend/app/models_ml/personalized_forecast.meta.json
            git commit -m "Update personalized forecast models"
            git push
          else
            echo "No changes to commit."
          fi
