global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: nostressia-backend
    metrics_path: /metrics
    static_configs:
      # Mode 1 (default): backend running directly on Windows host via uvicorn.
      - targets: ["host.docker.internal:8000"]

      # Mode 2: backend running as a Docker service on the same Compose network.
      # - targets: ["nostressia-backend:8000"]
