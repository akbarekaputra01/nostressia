sonar.projectKey=akbarekaputra01_nostressia
sonar.organization=akbarekaputra01

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=nostressia
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\\" by "/" on Windows.
sonar.sources=nostressia-backend,nostressia-frontend,nostressia-machine-learning
sonar.tests=nostressia-backend/tests,nostressia-frontend/src/__tests__,nostressia-machine-learning/tests

# Keep test files out of source metrics.
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**,**/dist/**,**/mlruns/**,**/coverage/**,**/*.ipynb
sonar.test.inclusions=nostressia-backend/tests/**/*.py,nostressia-frontend/src/__tests__/**/*.js,nostressia-frontend/src/__tests__/**/*.jsx,nostressia-frontend/src/__tests__/**/*.ts,nostressia-frontend/src/__tests__/**/*.tsx,nostressia-machine-learning/tests/**/*.py
sonar.cpd.exclusions=nostressia-backend/tests/**,nostressia-frontend/src/__tests__/**,nostressia-machine-learning/tests/**

# Coverage reports consumed by Sonar.
sonar.python.coverage.reportPaths=nostressia-backend/coverage.xml
sonar.coverage.exclusions=nostressia-frontend/**,nostressia-machine-learning/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Set Python version explicitly
sonar.python.version=3.10
